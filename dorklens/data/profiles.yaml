  max_dork_queries: 20
  rps_per_host: 4.0
  concurrency: 6
  min_confidence: 3
  max_payload_urls: 40
  deep: false
full:
  stages: [passive, dork, crawl, dirs, payload]
  max_dork_queries: 40
  rps_per_host: 3.0
  concurrency: 8
  min_confidence: 2
  max_payload_urls: 200
  deep: false
deep:
  stages: [passive, dork, crawl, dirs, payload, blind]
  max_dork_queries: 80
  rps_per_host: 2.0
  concurrency: 6
  min_confidence: 2
  max_payload_urls: 60
  deep: true
lab:
  stages: [crawl, dirs, payload]
  wordlist: lab-wordlist.txt
  post: true
  post_paths: [/rest/user/login]
  rps_per_host: 20.0
  concurrency: 8
  min_confidence: 1
  max_payload_urls: 50
  deep: false
