name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
      - name: Types
        run: |
          python -m pip install mypy
          mypy scopeforge --ignore-missing-imports --check-untyped-defs
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke check
        run: python -m scopeforge --version

  arch:
    name: tests / archlinux
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install base packages
        run: pacman -Syu --noconfirm git python python-pip
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install --break-system-packages -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke check
        run: python -m scopeforge --version

  lab:
    name: lab / juice-shop
    runs-on: ubuntu-latest
    services:
      juice:
        image: bkimminich/juice-shop
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e .
      - name: Wait for lab
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://localhost:3000/", timeout=2).read(1)
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("lab did not become ready")
          PY
      - name: Integration
        env:
          SF_LAB_URL: http://localhost:3000
        run: python -m unittest tests.test_lab_integration -v
