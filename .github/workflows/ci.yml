name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
      - name: Types
        run: |
          python -m pip install mypy
          mypy dorklens --ignore-missing-imports --check-untyped-defs
      - name: Compile
        run: python -m compileall -q dorklens
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke check
        run: python -m dorklens --version

  arch:
    name: tests / archlinux
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install base packages
        run: pacman -Syu --noconfirm git python python-pip
      - uses: actions/checkout@v4
      - name: Install package
        run: python -m pip install --break-system-packages -e .
      - name: Compile
        run: python -m compileall -q dorklens
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke check
        run: python -m dorklens --version
