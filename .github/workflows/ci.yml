name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy dorklens --ignore-missing-imports --check-untyped-defs
      - name: Compile
        run: python -m compileall -q dorklens
      - name: Unit tests
        run: python -m pytest -q
      - name: Self test
        run: python -m dorklens selftest
      - name: Offline demo
        run: python -m dorklens demo --out dorklens-demo-ci
      - name: Version
        run: python -m dorklens --version

  juice-shop-lab:
    name: lab / juice-shop
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Juice Shop did not start"
          exit 1
      - name: Scan authorized local lab
        run: python -m dorklens 127.0.0.1:3000 -p lab -s 127.0.0.1 -y -o dorklens-lab-ci
      - name: Assert findings
        run: python scripts/lab_assert.py dorklens-lab-ci
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-report
          path: dorklens-lab-ci
