name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy dorklens --ignore-missing-imports --check-untyped-defs
      - name: Compile
        run: python -m compileall -q dorklens
      - name: Unit tests
        run: python -m pytest -q
      - name: Self test
        run: python -m dorklens selftest
      - name: Offline demo
        run: python -m dorklens demo --out dorklens-demo-ci
      - name: Version
        run: python -m dorklens --version
