[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorklens"
version = "1.0.0"
description = "DorkLens - point it, and it sees"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "z7-codes" }]
keywords = ["dorks", "osint", "recon", "security", "cli", "authorized-testing"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "rich>=13",
  "selectolax>=0.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
dorklens = "dorklens.cli:main"

[tool.setuptools.packages.find]
include = ["dorklens*"]

[tool.setuptools.package-data]
dorklens = ["data/*.yaml", "data/*.txt", "data/demo/*", "data/demo/backup/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
