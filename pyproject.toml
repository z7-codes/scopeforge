[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeforge"
description = "Scope-safe recon planning, evidence triage, and report drafting."
requires-python = ">=3.10"
authors = [{ name = "z7-codes" }]
readme = "README.md"
dynamic = ["version"]

[project.scripts]
scopeforge = "scopeforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scopeforge.__version__" }

[tool.setuptools.packages.find]
include = ["scopeforge*"]

[tool.setuptools.package-data]
scopeforge = ["data/*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
