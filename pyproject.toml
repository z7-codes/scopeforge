[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorklens-cli"
description = "Cross-platform advanced dork generator and passive public exposure discovery CLI."
requires-python = ">=3.10"
authors = [{ name = "z7-codes" }]
readme = "README.md"
keywords = ["google-dorks", "osint", "passive-recon", "exposure", "cli", "security"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dynamic = ["version"]

[project.scripts]
dorklens = "dorklens.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dorklens.__version__" }

[tool.setuptools.packages.find]
include = ["dorklens*"]

[tool.setuptools.package-data]
dorklens = ["data/*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
